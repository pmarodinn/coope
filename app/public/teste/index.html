<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesquisa – carregando…</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; font-family: sans-serif; background: #f5f5f5; color: #333;
           flex-direction: column; gap: 12px; padding: 24px; box-sizing: border-box; }
    #log { font-size: 13px; color: #555; max-width: 500px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <p>Carregando…</p>
  <div id="log"></div>
  <script>
  const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; };

  (async () => {
    const PROJECT = 'pesquisa-dores---coope';
    const KEY     = 'AIzaSyAiEVgfCJ4hTUoU9RLnGPPALU1CTmQ-c8s';
    const DESTINO = 'https://pmarodinn.github.io/coope/pesquisa/?teste=1';

    let ip = '';
    try {
      log('Buscando IP…');
      const r = await fetch('https://api.ipify.org?format=json');
      ip = (await r.json()).ip ?? '';
      log('IP: ' + ip);
    } catch (e) {
      log('IP falhou: ' + e.message);
    }

    const ts = new Date().toISOString();
    const id = ts.replace(/[-:T.Z]/g, '').slice(0, 12) + '-' + Math.random().toString(36).slice(2, 8);

    try {
      log('Gravando no Firebase…');
      const resp = await fetch(
        `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/testes_ip?documentId=${id}&key=${KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              ip:       { stringValue: ip },
              ts:       { stringValue: ts },
              ua:       { stringValue: navigator.userAgent.slice(0, 300) },
              referrer: { stringValue: document.referrer.slice(0, 200) },
            },
          }),
        }
      );
      log('Firebase: ' + resp.status + (resp.ok ? ' ✓' : ' ✗'));
    } catch (e) {
      log('Firebase falhou: ' + e.message);
    }

    log('Redirecionando em 5s…');
    await new Promise(r => setTimeout(r, 5000));
    location.replace(DESTINO);
  })();
  </script>
</body>
</html>
